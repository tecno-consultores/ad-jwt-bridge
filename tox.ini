[tox]
env_list = py310, py311, py312, py313
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
    pytest-mock
    httpx
commands =
    pytest -m "not integration" {posargs}

[testenv:lint]
deps = ruff
commands = ruff check src tests

[testenv:typecheck]
deps = mypy
commands = mypy src
