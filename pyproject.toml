[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ad-jwt-bridge"
version = "0.1.0"
description = "Identity Broker conectando FastAPI con Active Directory vía LDAP y emitiendo JWTs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "ldap3>=2.9.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "tox>=4.14.0",
    "tox-uv>=1.7.0"
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=95"
markers = [
    "integration: Pruebas End-to-End que requieren conexión a internet/red y credenciales reales en .env",
]

[tool.mypy]
strict = true
warn_return_any = true
show_error_codes = true
# ldap3 no tiene stubs de tipos oficiales, por lo que ignoramos sus imports
[[tool.mypy.overrides]]
module = "ldap3.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"] # Errores, Fallos, y ordenamiento de Imports (Isort)

[tool.hatch.build.targets.wheel]
packages = ["src"]
